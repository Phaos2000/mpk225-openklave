name: MPK225 offline build and tests
on:
  push:
    branches:
      - development/v0.2-chord-pipeline
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-and-arm:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout custom-firmware source
        uses: actions/checkout@v4
      - name: Build and run all host-side MIDI/harmony tests
        shell: bash
        run: |
          set -euo pipefail
          for f in tests/test_*.cpp; do
            test="${f##*/}"
            g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic -Iinclude "$f" -o "/tmp/${test%.cpp}"
            "/tmp/${test%.cpp}"
          done
          python3 tests/test_patch_tool.py
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -Iinclude -DMPK225_CANDIDATE_CHORD_ON_BOOT=1 tests/test_chord_boot_variant.cpp -o /tmp/test_chord_boot_enabled
          /tmp/test_chord_boot_enabled
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic -Iinclude -DMPK225_CANDIDATE_CHORD_ON_BOOT=1 -DMPK225_CANDIDATE_SMART_ON_BOOT=1 tests/test_embedded_smart.cpp -o /tmp/test_smart_embedded
          /tmp/test_smart_embedded
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic -Iinclude -DMPK225_CANDIDATE_CHORD_ON_BOOT=1 -DMPK225_CANDIDATE_SMART_ON_BOOT=1 tests/test_transport_reset.cpp -o /tmp/test_reset_smart
          /tmp/test_reset_smart
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic -Iinclude tools/mpk225_live_chords_win.cpp -o /tmp/mpk225_host_bridge
          /tmp/mpk225_host_bridge --selftest
      - name: Install Cortex-M3 compiler (no device access)
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends gcc-arm-none-eabi libnewlib-arm-none-eabi
      - name: Compile freestanding harmony/MIDI for ARM
        run: |
          arm-none-eabi-g++ -std=c++17 -O2 -Wall -Wextra -mcpu=cortex-m3 -mthumb -ffreestanding -fno-exceptions -fno-rtti -Iinclude -c tests/arm_smart.cpp -o /tmp/arm_smart.o
          arm-none-eabi-size /tmp/arm_smart.o
      - name: Prepare independent OpenKlave reference (pinned October 2021)
        run: |
          git clone --quiet https://github.com/sillsm/openklave.git /tmp/openklave
          git -C /tmp/openklave checkout --quiet 44a10eae127e5f77b73967d43e1d4d73c5fbf6f4
          python3 integration/patch_openklave.py --upstream /tmp/openklave --output /tmp/openklave-candidate
      - name: Attempt full ELF build of guarded candidate (NO flashing)
        run: |
          make -C /tmp/openklave-candidate/src led.elf
          arm-none-eabi-size /tmp/openklave-candidate/src/led.elf
          arm-none-eabi-objdump -h /tmp/openklave-candidate/src/led.elf
          cp /tmp/openklave-candidate/src/led.elf /tmp/led-passthrough-not-installable.elf
          make -B -C /tmp/openklave-candidate/src led.elf CHORD_ON_BOOT=1
          arm-none-eabi-size /tmp/openklave-candidate/src/led.elf
          arm-none-eabi-readelf -s /tmp/openklave-candidate/src/led.elf | grep -E 'OpenKlaveMidiBridge|ConsumeNote' || true
          cp /tmp/openklave-candidate/src/led.elf /tmp/led-chord-on-boot-not-installable.elf
          if cmp -s /tmp/led-passthrough-not-installable.elf /tmp/led-chord-on-boot-not-installable.elf; then
            echo "ERROR: candidate chord-on-boot flag did not alter the linked ELF"
            exit 1
          fi
          sha256sum /tmp/led-{passthrough,chord-on-boot}-not-installable.elf
          make -B -C /tmp/openklave-candidate/src led.elf CHORD_ON_BOOT=1 FACTORY_SCAN=1
          cp /tmp/openklave-candidate/src/led.elf /tmp/led-mpk225-model1-not-installable.elf
          if cmp -s /tmp/led-chord-on-boot-not-installable.elf /tmp/led-mpk225-model1-not-installable.elf; then
            echo "ERROR: MPK225 factory-derived scan option did not alter linked ELF"
            exit 1
          fi
          arm-none-eabi-size /tmp/led-mpk225-model1-not-installable.elf
          sha256sum /tmp/led-mpk225-model1-not-installable.elf
          make -B -C /tmp/openklave-candidate/src led.elf CHORD_ON_BOOT=1 FACTORY_SCAN=1 SMART_ON_BOOT=1
          cp /tmp/openklave-candidate/src/led.elf /tmp/led-mpk225-smart-not-installable.elf
          if cmp -s /tmp/led-mpk225-model1-not-installable.elf /tmp/led-mpk225-smart-not-installable.elf; then
            echo "ERROR: smart chord flag did not change Cortex-M3 executable"
            exit 1
          fi
          arm-none-eabi-size /tmp/led-mpk225-smart-not-installable.elf
          arm-none-eabi-nm /tmp/led-mpk225-smart-not-installable.elf | grep -Ei '^2000c000 [Aa] _estack$'
          sha256sum /tmp/led-mpk225-smart-not-installable.elf
          arm-none-eabi-objcopy --dump-section .mySegment=/tmp/mpk225-boot-signature.bin /tmp/led-mpk225-smart-not-installable.elf
          python3 -c 'from pathlib import Path; sig=Path("/tmp/mpk225-boot-signature.bin").read_bytes(); assert sig==bytes.fromhex("414434415f5269636861726400010002"), "Boot signature does not match official Akai v1.02 16-byte token"'
      - name: Verify firmware release actions remain disabled
        run: |
          ! grep -q 'python ../util/wipe_os.py' /tmp/openklave-candidate/src/Makefile
          ! grep -q 'python ../util/flash_os.py' /tmp/openklave-candidate/src/Makefile
          grep -q 'Disabled: MPK225 recovery not verified' /tmp/openklave-candidate/src/Makefile

  windows-live-bridge:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - name: Checkout same chord engine source
        uses: actions/checkout@v4
      - name: Build native WinMM audition program and run offline selftest
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /std:c++17 /EHsc /O2 /W4 /MT /Iinclude tools\mpk225_live_chords_win.cpp /link winmm.lib user32.lib /OUT:MPK225-Live-Chords.exe
          MPK225-Live-Chords.exe --selftest
          MPK225-Live-Chords.exe --suggest G --tonic C --scale major --filter strict
          MPK225-Live-Chords.exe --suggest all --tonic C --scale major --filter strict
      - name: Publish host-side executable for stock-firmware testing
        uses: actions/upload-artifact@v4
        with:
          name: MPK225-Live-Chords-Win64-NOT-FIRMWARE
          path: MPK225-Live-Chords.exe
          retention-days: 7
